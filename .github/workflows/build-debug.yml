# Build a debug APK entirely from your phone — no laptop needed.
#
# Push a commit (from the GitHub mobile web editor or any phone git client)
# and this workflow builds the APK and uploads it as a downloadable artifact.
# You then grab it from the Actions tab on github.com (mobile browser works).
#
# Trigger branches include the focused diagnostic branch so its APK is built
# automatically after every pushed diagnostic change.

name: Build Debug APK

on:
  push:
    branches: [ main, master, build, hls-diagnostic-build ]
  workflow_dispatch:   # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # harmless if your repo has none

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kino-debug-apk
          path: app/build/outputs/apk/**/debug/*.apk
          retention-days: 30
          if-no-files-found: error
